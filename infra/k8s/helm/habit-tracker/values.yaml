namespace: habit-dev
frontend:
  image: brandonchongwenjun/habit-frontend:64db555c5ef5b5acd7dbdd31d9678511fcbfdd9c
  port: 80
habitService:
  image: brandonchongwenjun/habit-service:64db555c5ef5b5acd7dbdd31d9678511fcbfdd9c
  port: 4000
  nodeEnv: production
  serviceName: habit-service
  serviceVersion: 1.0.0
userService:
  image: brandonchongwenjun/user-service:64db555c5ef5b5acd7dbdd31d9678511fcbfdd9c
  port: 4001
  nodeEnv: production
  serviceName: user-service
  serviceVersion: 1.0.0
analytics:
  image: brandonchongwenjun/habit-analytics:64db555c5ef5b5acd7dbdd31d9678511fcbfdd9c
  nodeEnv: production
  serviceName: analytics-service
  serviceVersion: 1.0.0
rabbitmq:
  image: rabbitmq:3-management
  username: guest
  password: guest
  storage: 1Gi
monitoring:
  prometheus:
    enabled: true
    retention: 15d
    scrapeInterval: 15s
    evaluationInterval: 15s
    storage: 10Gi
  grafana:
    enabled: true
    adminUser: admin
    domain: habit-tracker.ltu-m7011e-8.se
    subPath: /grafana
    serveFromSubPath: true
