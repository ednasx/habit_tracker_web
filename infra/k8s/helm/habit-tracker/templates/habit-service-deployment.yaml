apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit-service
  template:
    metadata:
      labels:
        app: habit-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.habitService.port }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: habit-service
          image: {{ .Values.habitService.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.habitService.port }}
          env:
            - name: NODE_ENV
              value: "{{ .Values.habitService.nodeEnv }}"
            - name: SERVICE_NAME
              value: "{{ .Values.habitService.serviceName }}"
            - name: SERVICE_VERSION
              value: "{{ .Values.habitService.serviceVersion }}"
            - name: PORT
              value: "{{ .Values.habitService.port }}"
            # Later: mount secrets for DB, Supabase, RabbitMQ, etc.
            - name: RABBITMQ_URL
              value: "amqp://habit-tracker-rabbitmq:5672"
            - name: RABBITMQ_HABIT_EXCHANGE
              value: "habit.events"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-supabase
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-supabase
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-supabase
                  key: SUPABASE_JWT_SECRET
