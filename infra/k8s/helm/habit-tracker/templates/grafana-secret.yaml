{{- if .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-grafana-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana
type: Opaque
data:
  # Password is created by CI/CD from GitHub Secrets
  # DO NOT commit actual passwords to this file
  admin-password: ""  # Base64 encoded password injected by kubectl
{{- end }}
