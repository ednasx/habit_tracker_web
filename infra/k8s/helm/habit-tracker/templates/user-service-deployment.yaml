apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: {{ .Values.userService.image }}
          ports:
            - containerPort: {{ .Values.userService.port }}
          env:
            - name: PORT
              value: "{{ .Values.userService.port }}"
            # Later: mount secrets for DB, Supabase, RabbitMQ, etc.
