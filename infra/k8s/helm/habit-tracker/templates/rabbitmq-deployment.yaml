apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-rabbitmq-plugins
  namespace: {{ .Values.namespace }}
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rabbitmq
  labels:
    app: habit-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit-rabbitmq
  template:
    metadata:
      labels:
        app: habit-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ .Values.rabbitmq.username | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              value: {{ .Values.rabbitmq.password | quote }}
          ports:
            - containerPort: 5672
            - containerPort: 15672
            - containerPort: 15692
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
      volumes:                             
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-rabbitmq-pvc
        - name: rabbitmq-plugins
          configMap:
            name: {{ .Release.Name }}-rabbitmq-plugins
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rabbitmq
spec:
  selector:
    app: habit-rabbitmq
  ports:
    - port: 5672
      name: amqp
    - port: 15672
      name: http
    - port: 15692
      name: prometheus
