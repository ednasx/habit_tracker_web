apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit-backend
  template:
    metadata:
      labels:
        app: habit-backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            # Later: mount secrets for DB, Supabase, RabbitMQ, etc.
