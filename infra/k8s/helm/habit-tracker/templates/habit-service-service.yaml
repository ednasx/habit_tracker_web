apiVersion: v1
kind: Service
metadata:
  name: habit-service
  namespace: {{ .Values.namespace }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: habit-service
  ports:
    - port: 4000
      targetPort: {{ .Values.habitService.port }}
      protocol: TCP
