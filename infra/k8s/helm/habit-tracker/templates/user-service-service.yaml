apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4001"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: user-service
  ports:
    - port: 4001
      targetPort: {{ .Values.userService.port }}
      protocol: TCP
