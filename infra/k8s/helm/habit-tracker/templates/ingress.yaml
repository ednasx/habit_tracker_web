apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - habit-tracker.ltu-m7011e-8.se
      secretName: habit-tls
  rules:
    - host: habit-tracker.ltu-m7011e-8.se
      http:
        paths:
          - path: /api/habits
            pathType: Prefix
            backend:
              service:
                name: habit-service
                port:
                  number: 4000
          - path: /api/leaderboard
            pathType: Prefix
            backend:
              service:
                name: habit-service
                port:
                  number: 4000
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 4001
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: habit-tracker-grafana
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: habit-frontend
                port:
                  number: 80
