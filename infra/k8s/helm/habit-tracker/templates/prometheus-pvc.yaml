{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-prometheus-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: prometheus
spec:
  accessModes:
    - ReadWriteOnce  # Only one pod can mount at a time
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.storage | default "10Gi" }}  # Default 10GB for metrics
{{- end }}

