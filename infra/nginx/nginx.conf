events {
    worker_connections 1024;
}

http {
    # Frontend app (React built, served by habit-frontend container on port 80)
    upstream frontend_app {
        server habit-frontend:80;
    }

    # Habit service (Node on 4000)
    upstream habit_service {
        server habit-service:4000;
    }

    # User service (Node on 4001)
    upstream user_service {
        server user-service:4001;
    }

    server {
        listen 80;

        # === Frontend SPA ===
        # Serve the React app for everything that isn't /api/...
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # === Habit service APIs ===
        location /api/habits {
            proxy_pass http://habit_service/api/habits;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/leaderboard {
            proxy_pass http://habit_service/api/leaderboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # === User service APIs ===
        location /api/users {
            proxy_pass http://user_service/api/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Optional unified health
        location /api/health {
            return 200 '{"status":"ok","gateway":"nginx-local"}';
            add_header Content-Type application/json;
        }
    }
}
