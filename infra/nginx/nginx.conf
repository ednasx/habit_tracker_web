events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Proxy /api/habits and /api/leaderboard to habit-service (port 4000)
        location /api/habits {
            proxy_pass http://habit-service:4000/api/habits;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/leaderboard {
            proxy_pass http://habit-service:4000/api/leaderboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy /api/users to user-service (port 4001)
        location /api/users {
            proxy_pass http://user-service:4001/api/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Optional: Proxy health check if you want a unified health endpoint
        location /api/health {
            return 200 '{"status":"ok","gateway":"nginx-local"}';
            add_header Content-Type application/json;
        }
    }
}

