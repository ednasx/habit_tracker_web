services:
  backend:
    build: ./backend
    container_name: habit-backend
    env_file:
      - backend/.env
    ports:
      - "4000:4000"
    depends_on:
      - rabbitmq

  frontend:
    build: ./frontend
    container_name: habit-frontend
    env_file:
      - frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend


  rabbitmq:
    image: rabbitmq:3-management
    container_name: habit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP (backend uses this)
      - "15672:15672"  # Management UI

  analytics-service:
    build: ./analytics-service
    container_name: habit-analytics
    env_file:
      - analytics-service/.env
    depends_on:
      - rabbitmq
