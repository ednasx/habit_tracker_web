version: "3.9"

services:
  # API Gateway for Local Dev
  nginx:
    image: nginx:alpine
    container_name: habit-gateway
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - habit-service
      - user-service
      - analytics-service

  habit-service:
    build: ./habit-service
    container_name: habit-service
    env_file:
      - habit-service/.env
    environment:
      # IMPORTANT: override any localhost value from .env
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "4000:4000"
    depends_on:
      - rabbitmq

  user-service:
    build: ./user-service
    container_name: user-service
    env_file:
      - user-service/.env
    # only add RABBITMQ_URL here if user-service actually uses RabbitMQ
    ports:
      - "4001:4001"
    depends_on:
      - rabbitmq

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: habit-frontend
    # optional: runtime env (not strictly needed for Vite, but harmless)
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    expose:
      - "80"
    depends_on:
      - habit-service
      - user-service



  rabbitmq:
    image: rabbitmq:3-management
    container_name: habit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP (backend uses this)
      - "15672:15672"  # Management UI

  analytics-service:
    build: ./analytics-service
    container_name: habit-analytics
    env_file:
      - analytics-service/.env
    environment:
      # IMPORTANT: override any localhost value from .env
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
