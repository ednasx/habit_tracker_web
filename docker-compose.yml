services:
  # API Gateway for Local Dev
  nginx:
    image: nginx:alpine
    container_name: habit-gateway
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - habit-service
      - user-service

  habit-service:
    build: ./habit-service
    container_name: habit-service
    env_file:
      - habit-service/.env
    ports:
      - "4000:4000"
    depends_on:
      - rabbitmq

  user-service:
    build: ./user-service
    container_name: user-service
    env_file:
      - user-service/.env
    ports:
      - "4001:4001"
    depends_on:
      - rabbitmq

  frontend:
    build: ./frontend
    container_name: habit-frontend
    env_file:
      - frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - nginx


  rabbitmq:
    image: rabbitmq:3-management
    container_name: habit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP (backend uses this)
      - "15672:15672"  # Management UI

  analytics-service:
    build: ./analytics-service
    container_name: habit-analytics
    env_file:
      - analytics-service/.env
    depends_on:
      - rabbitmq
