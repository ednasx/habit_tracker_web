name: CD - Build and Deploy

on:
  push:
    branches: [ main ]
    # Only run on pushes to main (assumes CI has passed via branch protection or manual verification)
  
permissions:
  contents: write #needed to update values.yaml

concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: false  # Wait for current run to finish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    #prevent infinite loop - skip if this commit was made by CD workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:latest
          cache-to: type=inline

      - name: Build and push habit-service image
        uses: docker/build-push-action@v5
        with:
          context: ./habit-service
          file: ./habit-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-service:latest
          cache-to: type=inline

      - name: Build and push user-service image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
          cache-to: type=inline

      - name: Build and push analytics-service image
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          file: ./analytics-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:latest
          cache-to: type=inline

      - name: Update Helm values.yaml with new image tags
        env:
          VALUES_FILE: infra/k8s/helm/habit-tracker/values.yaml
          COMMIT_SHA: ${{ github.sha }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import os
          import sys

          values_file = os.environ['VALUES_FILE']
          commit_sha = os.environ['COMMIT_SHA']
          docker_user = os.environ['DOCKER_USER']

          # Validate inputs
          if not commit_sha or not docker_user:
              print("ERROR: COMMIT_SHA or DOCKER_USER is missing", file=sys.stderr)
              sys.exit(1)

          # Check if file exists
          if not os.path.exists(values_file):
              print(f"ERROR: File not found: {values_file}", file=sys.stderr)
              sys.exit(1)

          # Read YAML with error handling
          try:
              with open(values_file, "r") as f:
                  data = yaml.safe_load(f)
              if data is None:
                  print("ERROR: Failed to parse YAML - file may be empty", file=sys.stderr)
                  sys.exit(1)
          except yaml.YAMLError as e:
              print(f"ERROR: Invalid YAML in {values_file}: {e}", file=sys.stderr)
              sys.exit(1)
          except IOError as e:
              print(f"ERROR: Failed to read {values_file}: {e}", file=sys.stderr)
              sys.exit(1)

          # Track updates
          updates = []

          # Update image tags with validation
          try:
              if 'frontend' in data and 'image' in data['frontend']:
                  data['frontend']['image'] = f'{docker_user}/habit-frontend:{commit_sha}'
                  updates.append('frontend')
              
              if 'habitService' in data and 'image' in data['habitService']:
                  data['habitService']['image'] = f'{docker_user}/habit-service:{commit_sha}'
                  updates.append('habitService')
              
              if 'userService' in data and 'image' in data['userService']:
                  data['userService']['image'] = f'{docker_user}/user-service:{commit_sha}'
                  updates.append('userService')
              
              if 'analytics' in data and 'image' in data['analytics']:
                  data['analytics']['image'] = f'{docker_user}/habit-analytics:{commit_sha}'
                  updates.append('analytics')
          except KeyError as e:
              print(f"ERROR: Missing expected key in YAML: {e}", file=sys.stderr)
              sys.exit(1)

          if not updates:
              print("ERROR: No image tags were updated", file=sys.stderr)
              sys.exit(1)

          # Write YAML with error handling
          try:
              with open(values_file, "w") as f:
                  yaml.dump(data, f, default_flow_style=False, sort_keys=False)
          except IOError as e:
              print(f"ERROR: Failed to write {values_file}: {e}", file=sys.stderr)
              sys.exit(1)

          print(f"✅ Successfully updated {len(updates)} service(s): {', '.join(updates)}")
          print(f"   Commit SHA: {commit_sha}")
          PYTHON_SCRIPT

      - name: Commit and push updated values.yaml
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if values.yaml was modified
          if git diff --quiet infra/k8s/helm/habit-tracker/values.yaml; then
            echo "No changes to values.yaml - skipping commit"
          else
            echo "values.yaml was modified - committing changes"
            
            # 1. Stage and Commit FIRST (This creates a clean working directory)
            git add infra/k8s/helm/habit-tracker/values.yaml
            git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
            
            # 2. Pull with Rebase (Safe now because we have committed)
            # This puts our new commit ON TOP of whatever is currently in main
            echo "Pulling latest changes from main..."
            git pull --rebase origin main || {
              echo "❌ ERROR: Failed to pull/rebase. Merge conflict detected."
              exit 1
            }
            
            # 3. Push
            echo "Pushing commit to main..."
            git push origin main || {
              echo "❌ ERROR: Failed to push. Remote has changed since pull."
              exit 1
            }
            
            echo "✅ Successfully updated and pushed values.yaml"
          fi

