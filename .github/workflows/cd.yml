name: CD - Build and Deploy

on:
  push:
    branches: [ main ]
    # Only run on pushes to main (assumes CI has passed via branch protection or manual verification)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend
            ${{ secrets.DOCKERHUB_USERNAME }}/habit-service
            ${{ secrets.DOCKERHUB_USERNAME }}/user-service
            ${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:latest
          cache-to: type=inline

      - name: Build and push habit-service image
        uses: docker/build-push-action@v5
        with:
          context: ./habit-service
          file: ./habit-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-service:latest
          cache-to: type=inline

      - name: Build and push user-service image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
          cache-to: type=inline

      - name: Build and push analytics-service image
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          file: ./analytics-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:latest
          cache-to: type=inline

      - name: Update Helm values.yaml with new image tags
        env:
          VALUES_FILE: infra/k8s/helm/habit-tracker/values.yaml
          COMMIT_SHA: ${{ github.sha }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Use Python to update YAML (more reliable than sed)
          python3 << 'PYTHON_SCRIPT'
          import re
          import os
          
          values_file = os.environ['VALUES_FILE']
          commit_sha = os.environ['COMMIT_SHA']
          docker_user = os.environ['DOCKER_USER']
          
          with open(values_file, "r") as f:
              content = f.read()
          
          # Update each image tag
          content = re.sub(
              r'image: ' + re.escape(docker_user) + r'/habit-frontend:.*',
              f'image: {docker_user}/habit-frontend:{commit_sha}',
              content
          )
          content = re.sub(
              r'image: ' + re.escape(docker_user) + r'/habit-service:.*',
              f'image: {docker_user}/habit-service:{commit_sha}',
              content
          )
          content = re.sub(
              r'image: ' + re.escape(docker_user) + r'/user-service:.*',
              f'image: {docker_user}/user-service:{commit_sha}',
              content
          )
          content = re.sub(
              r'image: ' + re.escape(docker_user) + r'/habit-analytics:.*',
              f'image: {docker_user}/habit-analytics:{commit_sha}',
              content
          )
          
          with open(values_file, "w") as f:
              f.write(content)
          
          print(f"Updated values.yaml with commit SHA: {commit_sha}")
          PYTHON_SCRIPT
          
          echo "Updated values.yaml:"
          cat "$VALUES_FILE"

      - name: Commit and push updated values.yaml
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet infra/k8s/helm/habit-tracker/values.yaml; then
            echo "No changes to values.yaml"
          else
            git add infra/k8s/helm/habit-tracker/values.yaml
            git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
            git push
          fi

