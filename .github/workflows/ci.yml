name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Test jobs run on both PRs and main pushes
  frontend:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #Downloads the entire contents of your Git repository onto the runner.

      - name: Use Node.js
        uses: actions/setup-node@v4 #Sets up the Node.js environment on the runner.
        with:
          node-version: 22 #Specifies the version of Node.js to use.

      - name: Install dependencies
        run: npm install #Installs the dependencies for the project.

      - name: Build frontend
        run: npm run build #Builds the frontend of the project.

      - name: Run frontend tests
        run: npm test #Runs the tests for the frontend of the project.

  habit-service:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    defaults:
      run:
        working-directory: habit-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #Downloads the entire contents of your Git repository onto the runner.

      - name: Use Node.js
        uses: actions/setup-node@v4 #Sets up the Node.js environment on the runner.
        with:
          node-version: 22 #Specifies the version of Node.js to use.

      - name: Install dependencies
        run: npm install #Installs the dependencies for the project.

      - name: Run habit-service tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

  user-service:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    defaults:
      run:
        working-directory: user-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run user-service tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

  analytics-service:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run analytics-service tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

  # Build and push Docker images (only on push to main, after tests pass)
  build-images:
    runs-on: ubuntu-latest
    # Only run on push to main (not PRs), after all tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: [frontend, habit-service, user-service, analytics-service]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-frontend:latest
          cache-to: type=inline

      - name: Build and push habit-service image
        uses: docker/build-push-action@v5
        with:
          context: ./habit-service
          file: ./habit-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-service:latest
          cache-to: type=inline

      - name: Build and push user-service image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
          cache-to: type=inline

      - name: Build and push analytics-service image
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-service
          file: ./analytics-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/habit-analytics:latest
          cache-to: type=inline
