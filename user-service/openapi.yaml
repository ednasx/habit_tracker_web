openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: |
    User management and friend system API for the Habit Tracker application.
    All endpoints except /health require a valid Supabase JWT (Bearer token).

servers:
  - url: http://localhost:4001/api
    description: Local development
  - url: https://your-domain.example.com/api
    description: Production (via Kubernetes/Rancher)

paths:
  /health:
    get:
      summary: Health check
      description: Returns basic service health information.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: user-service

  /users/profile:
    get:
      summary: Get current user's profile
      description: Returns the profile of the authenticated user including username and display name.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not found (user needs to create profile)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create or update user profile
      description: >
        Create or update the user's profile with a username and optional display name.
        Username must be unique and follow the format: 3-20 characters, lowercase letters,
        numbers, underscores, or hyphens only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  example: john_doe
                  pattern: '^[a-z0-9_-]{3,20}$'
                  description: Unique username (3-20 chars, lowercase alphanumeric, underscores, hyphens)
                display_name:
                  type: string
                  example: John Doe
                  description: Optional display name
      responses:
        '201':
          description: Profile created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error (e.g. invalid username format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/search:
    get:
      summary: Search users by username
      description: Search for users by username (partial match). Returns up to 20 results.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query (minimum 2 characters)
          example: john
      responses:
        '200':
          description: List of matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSearchResult'
        '400':
          description: Missing or invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/friends:
    get:
      summary: List accepted friends
      description: Returns a list of all accepted friends for the current user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Friend'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/friends/pending:
    get:
      summary: List pending friend requests received
      description: Returns a list of pending friend requests sent to the current user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of pending friend requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequest'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/friends/sent:
    get:
      summary: List sent friend requests
      description: Returns a list of pending friend requests sent by the current user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of sent friend requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequest'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/friends/request:
    post:
      summary: Send friend request by username
      description: >
        Send a friend request to another user by their username.
        The request will be pending until the other user accepts or rejects it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  example: jane_smith
                  description: Username of the user to send friend request to
      responses:
        '201':
          description: Friend request sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Friend request sent
                  request:
                    $ref: '#/components/schemas/FriendRequestDetails'
        '400':
          description: Validation error (e.g. missing username, cannot add yourself)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict (friend request already sent, already friends, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/friends/{friendId}/accept:
    post:
      summary: Accept friend request
      description: Accept a pending friend request from another user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
            format: uuid
          description: User ID of the person who sent the friend request
      responses:
        '200':
          description: Friend request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Friend request accepted
                  friendship:
                    $ref: '#/components/schemas/Friendship'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Friend request not found or already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/friends/{friendId}/reject:
    post:
      summary: Reject friend request
      description: Reject a pending friend request from another user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
            format: uuid
          description: User ID of the person who sent the friend request
      responses:
        '200':
          description: Friend request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Friend request rejected
                  friendship:
                    $ref: '#/components/schemas/Friendship'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Friend request not found or already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/friends/{friendId}:
    delete:
      summary: Remove friend
      description: Remove an accepted friendship with another user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
            format: uuid
          description: User ID of the friend to remove
      responses:
        '204':
          description: Friendship removed successfully
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Friendship not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "91b6a89b-2a93-4cf3-bb8a-44ba1a6d3e4b"
        username:
          type: string
          example: john_doe
        display_name:
          type: string
          nullable: true
          example: John Doe
        created_at:
          type: string
          format: date-time
          example: "2025-12-05T10:15:30.000Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-12-05T10:15:30.000Z"

    UserSearchResult:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "91b6a89b-2a93-4cf3-bb8a-44ba1a6d3e4b"
        username:
          type: string
          example: jane_smith
        display_name:
          type: string
          nullable: true
          example: Jane Smith

    Friend:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "91b6a89b-2a93-4cf3-bb8a-44ba1a6d3e4b"
        username:
          type: string
          example: jane_smith
        display_name:
          type: string
          nullable: true
          example: Jane Smith

    FriendRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "91b6a89b-2a93-4cf3-bb8a-44ba1a6d3e4b"
        username:
          type: string
          example: jane_smith
        display_name:
          type: string
          nullable: true
          example: Jane Smith
        created_at:
          type: string
          format: date-time
          example: "2025-12-05T10:15:30.000Z"

    FriendRequestDetails:
      type: object
      properties:
        friend_id:
          type: string
          format: uuid
          example: "91b6a89b-2a93-4cf3-bb8a-44ba1a6d3e4b"
        username:
          type: string
          example: jane_smith
        status:
          type: string
          enum: [pending, accepted, rejected]
          example: pending
        created_at:
          type: string
          format: date-time
          example: "2025-12-05T10:15:30.000Z"

    Friendship:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "91b6a89b-2a93-4cf3-bb8a-44ba1a6d3e4b"
        friend_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        status:
          type: string
          enum: [pending, accepted, rejected]
          example: accepted
        updated_at:
          type: string
          format: date-time
          example: "2025-12-05T10:15:30.000Z"

    Error:
      type: object
      properties:
        message:
          type: string
          example: Something went wrong
        error:
          type: string
          example: Detailed error message
